<body class="selection:bg-hud-cyan selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper component for KaTeX rendering
    function MathFormula({ formula, display = false }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.katex) {
          try {
            window.katex.render(formula, containerRef.current, {
              displayMode: display,
              throwOnError: false
            });
          } catch (e) {
            containerRef.current.innerText = formula;
          }
        }
      }, [formula, display]);

      return <span ref={containerRef} className={display ? "block my-2 overflow-x-auto text-hud-cyan font-mono text-sm" : "inline text-hud-cyan font-mono"} />;
    }

    // =========================================================================
    // 3D HOLOGRAPHIC SPECTRAL VIEWPORT COMPONENT (Three.js WebGL)
    // Matches the territory studio reference: Golden Amber outer ribs + Arc Cyan core iris
    // =========================================================================
    function HolographicSpectralWave({
      isOrbiting,
      showGradCam,
      isMasked
    }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const meshRef = useRef(null);
      const pointsRef = useRef(null);
      const coreMeshRef = useRef(null);
      const animFrameRef = useRef(null);
      const isDraggingRef = useRef(false);
      const prevMousePosRef = useRef({ x: 0, y: 0 });

      // Spectral Mesh Dimensions: 80 Mel bins (Z) x 256 Time frames (X)
      const MEL_BINS = 80;
      const TIME_FRAMES = 256;

      useEffect(() => {
        const width = mountRef.current.clientWidth;
        const height = mountRef.current.clientHeight;

        // Scene
        const scene = new THREE.Scene();
        sceneRef.current = scene;

        // Camera
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 44, 86);
        camera.lookAt(0, 0, 0);

        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        rendererRef.current = renderer;
        mountRef.current.appendChild(renderer.domElement);

        // Ground reference grid (tactical deep navy/blue hairlines)
        const gridHelper = new THREE.GridHelper(90, 30, 0x00E5FF, 0x142442);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        // 3D Parametric Terrain Geometry: 80 Mel bins x 256 Time frames
        const planeWidth = 74;
        const planeDepth = 52;
        const geometry = new THREE.PlaneGeometry(
          planeWidth,
          planeDepth,
          TIME_FRAMES - 1,
          MEL_BINS - 1
        );
        geometry.rotateX(-Math.PI / 2);

        const positionAttr = geometry.attributes.position;
        const vertexCount = positionAttr.count;
        const colors = new Float32Array(vertexCount * 3);

        // Color Palette matching reference image:
        // Exterior Ribs: Golden Amber #FFB703 -> [1.0, 0.72, 0.01]
        // Intense Harmonic Core: Arc Cyan #00E5FF -> [0.0, 0.90, 1.0]
        // Alert Salient Peak: #FB8500 / #EF4444

        for (let i = 0; i < vertexCount; i++) {
          colors[i * 3] = 1.0;
          colors[i * 3 + 1] = 0.72;
          colors[i * 3 + 2] = 0.01;
        }
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Wireframe Mesh Material with Additive Blending
        const wireMaterial = new THREE.MeshBasicMaterial({
          wireframe: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.88,
          blending: THREE.AdditiveBlending
        });

        const spectralMesh = new THREE.Mesh(geometry, wireMaterial);
        meshRef.current = spectralMesh;
        scene.add(spectralMesh);

        // Glowing particle points at vertices
        const pointsMaterial = new THREE.PointsMaterial({
          size: 0.42,
          vertexColors: true,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending
        });
        const pointsMesh = new THREE.Points(geometry, pointsMaterial);
        pointsRef.current = pointsMesh;
        scene.add(pointsMesh);

        // Center Glowing Holographic Core Iris (Matching the blue glowing circle in reference image)
        const coreGeo = new THREE.RingGeometry(2.5, 6.5, 32);
        const coreMat = new THREE.MeshBasicMaterial({
          color: 0x00E5FF,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.rotation.x = -Math.PI / 2;
        coreMesh.position.set(-6, 2.5, 6);
        coreMeshRef.current = coreMesh;
        scene.add(coreMesh);

        // Target Lock 3D Bounding Box around dominant F0 formant peak
        const boxGeo = new THREE.BoxGeometry(16, 11, 10);
        const boxMat = new THREE.MeshBasicMaterial({
          color: 0x00E5FF,
          wireframe: true,
          transparent: true,
          opacity: 0.75
        });
        const targetBox = new THREE.Mesh(boxGeo, boxMat);
        targetBox.position.set(-6, 2, 6);
        scene.add(targetBox);

        // Interactive Mouse Orbit Logic
        const domEl = renderer.domElement;
        const handleMouseDown = (e) => {
          isDraggingRef.current = true;
          prevMousePosRef.current = { x: e.clientX, y: e.clientY };
        };
        const handleMouseMove = (e) => {
          if (!isDraggingRef.current) return;
          const deltaX = e.clientX - prevMousePosRef.current.x;
          const deltaY = e.clientY - prevMousePosRef.current.y;
          if (spectralMesh) {
            spectralMesh.rotation.y += deltaX * 0.008;
            pointsMesh.rotation.y += deltaX * 0.008;
            coreMesh.rotation.z += deltaX * 0.008;
            targetBox.rotation.y += deltaX * 0.008;
          }
          prevMousePosRef.current = { x: e.clientX, y: e.clientY };
        };
        const handleMouseUp = () => { isDraggingRef.current = false; };

        domEl.addEventListener("mousedown", handleMouseDown);
        window.addEventListener("mousemove", handleMouseMove);
        window.addEventListener("mouseup", handleMouseUp);

        // Resize Listener
        const handleResize = () => {
          if (!mountRef.current || !rendererRef.current) return;
          const w = mountRef.current.clientWidth;
          const h = mountRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          rendererRef.current.setSize(w, h);
        };
        window.addEventListener("resize", handleResize);

        // Animation Loop
        let clock = new THREE.Clock();
        const animate = () => {
          animFrameRef.current = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          // Auto-orbit if toggled on and not dragging
          if (isOrbiting && !isDraggingRef.current) {
            spectralMesh.rotation.y += 0.0035;
            pointsMesh.rotation.y += 0.0035;
            coreMesh.rotation.z += 0.01;
            targetBox.rotation.y += 0.0035;
          }

          // Compute dynamic Log-Mel spectral displacement
          const pos = geometry.attributes.position;
          const col = geometry.attributes.color;

          for (let z = 0; z < MEL_BINS; z++) {
            for (let x = 0; x < TIME_FRAMES; x++) {
              const idx = z * TIME_FRAMES + x;
              const normX = x / TIME_FRAMES;
              const normZ = z / MEL_BINS;

              // Harmonic formant synthesis modeling F0 (~184Hz), F1, F2
              const f0Harmonic = Math.sin(normX * 14.0 + t * 2.0) * Math.exp(-Math.pow((normZ - 0.22) * 8.0, 2));
              const f1Harmonic = 0.65 * Math.sin(normX * 22.0 - t * 1.5) * Math.exp(-Math.pow((normZ - 0.45) * 6.0, 2));
              const turbulence = 0.25 * Math.sin(normX * 42.0 + normZ * 32.0 + t * 4.0);
              const burstEnvelope = Math.exp(-Math.pow((normX - 0.42) * 5.0, 2));

              let energy = (f0Harmonic * 7.5 + f1Harmonic * 4.8 + turbulence * 1.5) * (0.35 + burstEnvelope * 0.95);

              // If 30% Salient masked, zero out the critical attribution hotspot
              const isHotspot = (normX >= 0.30 && normX <= 0.55 && normZ >= 0.12 && normZ <= 0.48);
              if (isMasked && isHotspot) {
                energy = energy * 0.08; // flattened
              }

              pos.setY(idx, energy);

              // Color dynamics matching reference image:
              // Glowing Arc Cyan core iris at hotspot/pitch contour, Golden Amber outer rib cage
              if (showGradCam && isHotspot) {
                if (isMasked) {
                  // Masked state: muted slate/steel
                  col.setXYZ(idx, 0.25, 0.32, 0.42);
                } else {
                  // High attribution active state: brilliant Arc Cyan core
                  const pulseIntensity = 0.7 + 0.3 * Math.sin(t * 5.0);
                  col.setXYZ(idx, 0.0, 0.90 * pulseIntensity, 1.0);
                }
              } else {
                const normHeight = Math.max(0, Math.min(1, (energy + 2.0) / 9.0));
                if (normHeight > 0.65) {
                  // Arc Cyan Energy Peak
                  col.setXYZ(idx, 0.0, 0.90, 1.0);
                } else if (normHeight > 0.35) {
                  // Golden Amber Ribs
                  col.setXYZ(idx, 1.0, 0.72, 0.01);
                } else {
                  // Warm Amber Base
                  col.setXYZ(idx, 0.92, 0.50, 0.05);
                }
              }
            }
          }

          pos.needsUpdate = true;
          col.needsUpdate = true;

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animFrameRef.current);
          window.removeEventListener("resize", handleResize);
          domEl.removeEventListener("mousedown", handleMouseDown);
          window.removeEventListener("mousemove", handleMouseMove);
          window.removeEventListener("mouseup", handleMouseUp);
          if (mountRef.current && renderer.domElement) {
            mountRef.current.removeChild(renderer.domElement);
          }
          geometry.dispose();
          wireMaterial.dispose();
          pointsMaterial.dispose();
          coreGeo.dispose();
          coreMat.dispose();
          renderer.dispose();
        };
      }, [isOrbiting, showGradCam, isMasked]);

      return (
        <div className="relative w-full h-full min-h-[440px] bg-hud-surface border border-hud-border overflow-hidden reticle-all">
          {/* 3D WebGL Canvas Mount */}
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

          {/* HUD Reticle Overlays: Concentric Tactical Radar Rings matching reference */}
          <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div className="w-[320px] h-[320px] rounded-full border border-hud-border/70 border-dashed spin-radar-ccw flex items-center justify-center">
              <div className="w-[220px] h-[220px] rounded-full border border-hud-amber/30 border-dotted spin-radar-cw flex items-center justify-center">
                <div className="w-[120px] h-[120px] rounded-full border border-hud-cyan/40" />
              </div>
            </div>
            {/* Center Crosshairs */}
            <div className="absolute w-8 h-[1px] bg-hud-cyan/70" />
            <div className="absolute h-8 w-[1px] bg-hud-cyan/70" />
          </div>

          {/* 2D HUD Telemetry Overlay Tags (matching reference image markers) */}
          <div className="absolute top-3 left-3 pointer-events-none space-y-1 font-mono text-[11px]">
            <div className="flex items-center space-x-2 text-hud-cyan">
              <span className="w-2 h-2 bg-hud-cyan inline-block tactical-pulse"></span>
              <span className="font-bold">VIEWPORT: 3D_LOGMEL_PARAMETRIC_SURFACE</span>
            </div>
            <div className="text-hud-steel">RESOLUTION: 80_MEL_BINS x 256_TIME_FRAMES</div>
            <div className="text-hud-amber font-semibold">
              F0_CONTOUR: 184.2_HZ | HARMONIC_RATIO: 1.103 | PITCH_TRACK: LOCKED
            </div>
          </div>

          <div className="absolute top-3 right-3 pointer-events-none font-mono text-right text-[11px]">
            <div className="text-hud-cyan font-bold">[ATTRIBUTION HOTSPOT: F0-F2 HARMONICS]</div>
            <div className="text-hud-steel">LAYER: ConvBlock_4 // K_DIM: [64, 4, 4]</div>
            <div className="text-hud-amber">
              STATUS: {isMasked ? "MASK_30_ACTIVE (DELTA: +31.29%)" : (showGradCam ? "GRAD-CAM_SALIENCY_ACTIVE" : "NORMALIZED_ENERGY")}
            </div>
          </div>

          {/* Micro Axis & Reference Markers matching reference image */}
          <div className="absolute bottom-3 left-3 pointer-events-none font-mono text-[10px] text-hud-steel flex space-x-4">
            <span>TAG: 2.455</span>
            <span>FREQ: 0 Hz » 1 kHz » 2 kHz » 4 kHz » 8 kHz</span>
            <span>PL. 2366</span>
          </div>

          <div className="absolute bottom-3 right-3 pointer-events-none font-mono text-[10px] text-hud-cyan flex space-x-3">
            <span>STMP: 1.2572 &lt;ON&gt;</span>
            <span>ROTATION: {isOrbiting ? "AUTO_ORBIT" : "DRAG_INSPECT"}</span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN PROJECT P.E.T.E.R. APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // Navigation Tabs: Story/Overview, DAG Architecture, Benchmarks, Causal XAI, Verification
      const [activeTab, setActiveTab] = useState("overview");

      // 3D Viewport Interactive Controls State
      const [isOrbiting, setIsOrbiting] = useState(true);
      const [showGradCam, setShowGradCam] = useState(true);
      const [isMasked, setIsMasked] = useState(false);
      const [audioPlaying, setAudioPlaying] = useState(false);

      // Selected Architecture Node for Inspection Drawer (Tab 2)
      const [selectedNode, setSelectedNode] = useState("node-deep");

      // Clipboard copy state
      const [copiedIndex, setCopiedIndex] = useState(null);

      // Web Audio Synthesizer (Simulates multi-harmonic expressive formant tone)
      const playAudioFormant = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          setAudioPlaying(true);

          const now = ctx.currentTime;
          const duration = 2.4;

          // Fundamental F0 (~184 Hz angry expressive pitch)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = "sawtooth";
          osc1.frequency.setValueAtTime(175, now);
          osc1.frequency.linearRampToValueAtTime(192, now + 0.8);
          osc1.frequency.exponentialRampToValueAtTime(160, now + duration);
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.linearRampToValueAtTime(0.01, now + duration);

          // F1 Formant filter (~750 Hz)
          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(750, now);
          filter.Q.setValueAtTime(4.0, now);

          osc1.connect(filter);
          filter.connect(gain1);
          gain1.connect(ctx.destination);

          osc1.start(now);
          osc1.stop(now + duration);

          osc1.onended = () => {
            setAudioPlaying(false);
          };
        } catch (e) {
          console.error("Web Audio playback failed:", e);
          setAudioPlaying(false);
        }
      };

      const copyCommand = (cmd, idx) => {
        navigator.clipboard.writeText(cmd);
        setCopiedIndex(idx);
        setTimeout(() => setCopiedIndex(null), 2000);
      };

      // Ensure Lucide icons render after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, selectedNode, showGradCam, isMasked]);

      // Node metadata definitions for Interactive DAG Architecture Blueprint (Tab 2)
      const architectureNodes = {
        "node-raw": {
          id: "node-raw",
          title: "01. RAW AUDIO CORPUS (RAVDESS)",
          stage: "INGESTION & CORPUS VERIFICATION",
          tensorShape: "[1440, T_raw] @ 48,000 Hz WAV (16-bit PCM)",
          latency: "0.12 ms/clip read",
          memory: "261 KB manifest / 1.4 GB raw audio",
          test: "tests/test_dataset.py::test_manifest_schema_and_integrity [PASS]",
          formula: "\\mathcal{D} = \\{(x_i, y_i, a_i, s_i)\\}_{i=1}^{1440}, \\quad a_i \\in \\{1, \\dots, 24\\}, \\; s_i \\in \\{M, F\\}",
          description: "Strictly validated 1,440 speech utterances across 24 professional actors (12 Male / 12 Female) enacting 8 distinct affective states with balanced normal and strong intensities."
        },
        "node-split": {
          id: "node-split",
          title: "02. ZERO-LEAKAGE PARTITION (GROUP-K-FOLD)",
          stage: "CROSS-VALIDATION PROTOCOL",
          tensorShape: "5 Disjoint Folds: Train (19-20 Actors), Val (4-5 Actors)",
          latency: "0.04 ms split assignment",
          memory: "Zero overhead (pre-assigned fold IDs)",
          test: "tests/test_dataset.py::test_zero_leakage_group_kfold [PASS]",
          formula: "\\mathcal{S}_{\\text{train}}^{(k)} \\cap \\mathcal{S}_{\\text{val}}^{(k)} = \\emptyset \\quad \\forall k \\in \\{0, 1, 2, 3, 4\\}",
          description: "Strict isolation of speaker biometric IDs. By ensuring zero overlap between training and validation actors, models are prohibited from memorizing individual vocal tract acoustics."
        },
        "node-classical": {
          id: "node-classical",
          title: "03A. CLASSICAL STREAM (eGeMAPSv02 + LightGBM)",
          stage: "DOMAIN-ENGINEERED BIOACOUSTIC BASELINE",
          tensorShape: "Features: [1440, 88] Functionals | Scaler: fitted on S_train",
          latency: "8.45 ms extraction / 0.88 ms inference",
          memory: "1.1 MB Parquet Feature Table",
          test: "tests/test_classical.py::test_classical_fold_disparity_invariants [PASS]",
          formula: "\\mathbf{z} = \\frac{\\mathbf{x}_{88} - \\mu_{\\text{train}}}{\\sigma_{\\text{train}}}, \\quad \\hat{y} = \\sum_{m=1}^{100} f_m(\\mathbf{z})",
